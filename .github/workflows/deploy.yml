name: Deploy server monitoring

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: server-monitoring-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment start
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
      - name: Configure pinned SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SERVER_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Install monitor and safe cleanup timers
        run: |
          set -euo pipefail
          target=ubuntu@51.68.122.229
          scp -q -i "$HOME/.ssh/id_ed25519" healthcheck.py alert-unit-failure.py telegram.py docker-cleanup.sh with-build-capacity.sh dependency-audit.py capture-dependency-manifest.sh install-dependency-audit-hooks.sh systemd/* "$target:/tmp/"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" \
            'sudo install -d -m 755 /opt/server-monitoring && \
             sudo install -m 644 /tmp/healthcheck.py /opt/server-monitoring/healthcheck.py && \
             sudo install -m 644 /tmp/alert-unit-failure.py /opt/server-monitoring/alert-unit-failure.py && \
             sudo install -m 644 /tmp/telegram.py /opt/server-monitoring/telegram.py && \
             sudo install -m 644 /tmp/dependency-audit.py /opt/server-monitoring/dependency-audit.py && \
             sudo install -m 755 /tmp/docker-cleanup.sh /opt/server-monitoring/docker-cleanup.sh && \
             sudo install -m 755 /tmp/with-build-capacity.sh /opt/server-monitoring/with-build-capacity.sh && \
             sudo install -m 755 /tmp/capture-dependency-manifest.sh /tmp/install-dependency-audit-hooks.sh /opt/server-monitoring/ && \
             sudo install -m 644 /tmp/server-monitoring.service /tmp/server-monitoring.timer /tmp/server-monitoring-docker-cleanup.service /tmp/server-monitoring-docker-cleanup.timer /tmp/server-monitoring-dependency-audit.service /tmp/server-monitoring-dependency-audit.timer /tmp/server-monitoring-failure@.service /etc/systemd/system/ && \
             sudo /opt/server-monitoring/install-dependency-audit-hooks.sh && \
             rm -f /tmp/healthcheck.py /tmp/alert-unit-failure.py /tmp/telegram.py /tmp/dependency-audit.py /tmp/capture-dependency-manifest.sh /tmp/install-dependency-audit-hooks.sh /tmp/docker-cleanup.sh /tmp/with-build-capacity.sh /tmp/server-monitoring.service /tmp/server-monitoring.timer /tmp/server-monitoring-docker-cleanup.service /tmp/server-monitoring-docker-cleanup.timer /tmp/server-monitoring-dependency-audit.service /tmp/server-monitoring-dependency-audit.timer /tmp/server-monitoring-failure@.service && \
             sudo systemctl daemon-reload && \
             sudo systemctl enable --now server-monitoring.timer server-monitoring-docker-cleanup.timer server-monitoring-dependency-audit.timer && \
             sudo systemctl disable --now 5sitios-docker-build-cache.timer && \
             sudo systemctl start server-monitoring.service && \
             systemctl is-enabled server-monitoring.timer server-monitoring-docker-cleanup.timer server-monitoring-dependency-audit.timer'
      - name: Report deployment to private monitoring bot
        if: ${{ always() }}
        uses: mpiquerasdev/server-monitoring@7976fb83874524804086bc6eeb6030a6150ee0c8
        with:
          bot-token: ${{ secrets.MONITOR_BOT_TOKEN }}
          chat-id: ${{ secrets.MONITOR_CHAT_ID }}
          service: Server monitoring
          url: https://github.com/mpiquerasdev/server-monitoring
          result: ${{ job.status }}
          started-at: ${{ steps.start.outputs.epoch }}
          run-url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
